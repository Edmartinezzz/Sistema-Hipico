# Archiva cada día los sorteos de animalitos del día anterior
# (data/animalitos/*.json.gz). La app en Streamlit Community Cloud carga
# ese archivo al instante, sin descargar meses de historial.
name: Archivar animalitos

on:
  schedule:
    # 04:30 UTC = 00:30 hora Venezuela, después del último sorteo.
    - cron: "30 4 * * *"
  workflow_dispatch: {}    # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write

concurrency:
  group: archivar
  cancel-in-progress: false

jobs:
  animalitos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias mínimas
        run: pip install "requests>=2.31.0" "beautifulsoup4>=4.12.0"

      - name: Archivar sorteos
        run: python scripts/archivar_animalitos.py

      - name: Registrar predicciones del día
        run: python scripts/registrar_predicciones.py

      - name: Subir cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/animalitos
          if git diff --cached --quiet; then
            echo "Sin sorteos nuevos."
          else
            git commit -m "datos: sorteos de animalitos"
            git pull --rebase
            git push
          fi
