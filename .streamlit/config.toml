# Tema visual del Sistema Hípico: azul/blanco/negro estilo app Android.
# Para un tema claro cambia base = "light" y ajusta los colores.

[theme]
base = "dark"
primaryColor = "#3B9DFF"
backgroundColor = "#060A12"
secondaryBackgroundColor = "#0E1626"
textColor = "#F2F6FC"
linkColor = "#7CC4FF"
borderColor = "#1E2C47"
showWidgetBorder = true
baseRadius = "0.75rem"
headingFont = "sans serif"
chartCategoricalColors = ["#3B9DFF", "#7CC4FF", "#F2F6FC", "#5A6E90", "#E5484D"]

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 500
enableStaticServing = true
